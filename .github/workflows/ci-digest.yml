# SPDX-License-Identifier: GPL-3.0-only
name: CI digest
on:
  workflow_run:
    workflows:
      - Lab CI
      - Golden patch renders (same-runner base/head gate)
      - M1 paired stage evidence (nonrequired)
      - Instruction count gate (advisory)
    types: [completed]
permissions: {}
# A repository-wide group safely serializes even events without a PR number.
# This avoids concurrent first-comment creation and stale overwrite races.
concurrency:
  group: ci-digest-sticky-global
  cancel-in-progress: false
jobs:
  digest:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted main workflow code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test digest parser
        run: python -m unittest tools/ci/test_ci_digest.py
      - name: Update digest from GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci/ci_digest.py
