# SPDX-License-Identifier: GPL-3.0-only
name: E4b layout stress
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'tests/native/abi2/live_replan_tests.cpp'
      - 'tests/native/abi2/e4b_osc_retirement.py'
      - '.github/workflows/e4b-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan-UBSan
            flags: '-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer'
          - name: TSan
            flags: '-fsanitize=thread -fno-omit-frame-pointer'
    name: E4b 10000 edits / ${{ matrix.name }}
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Configure sanitizer build
        env:
          SAN_FLAGS: ${{ matrix.flags }}
        run: |
          cmake -S native -B build/e4b -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS="$SAN_FLAGS" -DCMAKE_C_FLAGS="$SAN_FLAGS"
      - run: cmake --build build/e4b --target abi2_live_replan_tests --parallel 4
      - name: Random valid edits with render and ingress active
        run: build/e4b/abi2_live_replan_tests --stress 10000
      - name: A51 actual OSC Out sidecar lifetime
        if: matrix.name == 'ASan-UBSan'
        run: |
          cmake --build build/e4b --target wirescape_engine_sidecar --parallel 4
          python tests/native/abi2/e4b_osc_retirement.py build/e4b/wirescape_engine_sidecar
