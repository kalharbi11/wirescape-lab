# SPDX-License-Identifier: GPL-3.0-only
name: Comparison harness (devices off)
on:
  pull_request:
    paths:
      - "bench/compare/**"
      - ".github/workflows/compare-offline.yml"
  workflow_dispatch:
jobs:
  synthetic-comparison:
    name: Comparison synthetic / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline dependencies only
        run: python -m pip install -r bench/compare/requirements.txt
      - name: Synthetic tests
        run: python -m unittest discover -s bench/compare/tests
      - name: Simulated process run; no audio or MIDI
        run: python bench/compare/measure.py --dry-run
      - name: Check neutral docs wording
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -c 'grep -rniE "\b(should|better|worse|good|bad|best)\b" bench/compare/*.md facts/compare/measured 2>/dev/null; test $? -eq 1'
      - name: Upload synthetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report-${{ matrix.os }}
          path: |
            bench/compare/results/**/manifest.json
            bench/compare/results/**/analysis.json
            bench/compare/results/**/report.md
          if-no-files-found: ignore
