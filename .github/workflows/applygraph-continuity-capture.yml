# SPDX-License-Identifier: GPL-3.0-only
name: E6 continuity capture
on:
  workflow_dispatch:
    inputs:
      e6_head:
        description: Exact E6 commit to build and measure
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E6_HEAD: ${{ inputs.e6_head }}
    steps:
      - name: Verify source pin
        run: '[[ "$E6_HEAD" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.e6_head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native build tools
        run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Build the exact head
        run: |
          test "$(git rev-parse HEAD)" = "$E6_HEAD"
          cmake -S native -B build/continuity -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/continuity --target wirescape_engine_sidecar --parallel 4
      - name: Capture three E6 continuity repeats with null audio and no MIDI
        run: |
          python bench/continuity/run.py \
            --engine build/continuity/wirescape-engine \
            --built-head "$E6_HEAD" --repeats 3 --only setModAmount \
            --out "$RUNNER_TEMP/e6-continuity/rows" \
            --keep "$RUNNER_TEMP/e6-continuity/raw"
          cat "$RUNNER_TEMP/e6-continuity/rows.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e6-continuity
          path: ${{ runner.temp }}/e6-continuity
