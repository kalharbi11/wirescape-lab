# SPDX-License-Identifier: GPL-3.0-only
name: T7.0 source-pinned capture (advisory)
on:
  pull_request:
    paths:
      - 'bench/offline/**'
      - '.github/workflows/t7-0-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: T7.0 capture / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CAPTURE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CAPTURE_HEAD }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline metric dependencies
        run: python -m pip install -r bench/offline/requirements.txt
      - name: Verify source and record machine class
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CAPTURE_HEAD"
          {
            printf 'source_sha=%s\n' "$CAPTURE_HEAD"
            printf 'runner_image=%s\nrunner_image_version=%s\n' "$ImageOS" "$ImageVersion"
            printf 'runner_arch=%s\narchitecture=%s\n' "$RUNNER_ARCH" "$(uname -m)"
            printf 'runner_label=%s\n' '${{ matrix.runner }}'
            printf 'date_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python --version
            cmake --version | head -n 1
            c++ --version | head -n 1
          } | tee "$RUNNER_TEMP/t7-0-run-info.txt"
      - name: Build Release headless at exact head
        run: python tools/dev.py build --headless --config Release
      - name: Pure DSP metric and capture tests
        run: python -m unittest discover -s bench/offline -p 'test_*.py' -v
      - name: Capture all CHAOS and switch baseline rows
        shell: bash
        run: |
          set -euo pipefail
          python bench/offline/t7_0.py \
            --build-dir build/native \
            --head "$CAPTURE_HEAD" \
            --out-dir "$RUNNER_TEMP/t7-0-raw" \
            --summary "$RUNNER_TEMP/t7-0-summary.json"
          python - "$RUNNER_TEMP/t7-0-summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          doc = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert isinstance(doc['provenance']['source_commit'], str) and len(doc['provenance']['source_commit']) == 40
          assert len(doc['alias_rows']) == 24 and len(doc['switch_rows']) == 4
          assert all(row['status'] in ('measured', 'unavailable') for row in doc['alias_rows'] + doc['switch_rows'])
          print('T7.0 capture inventory: 24 alias rows and 4 switch rows with explicit status')
          PY
      - name: Upload measured raw source and summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t7-0-capture-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/t7-0-raw/
            ${{ runner.temp }}/t7-0-summary.json
            ${{ runner.temp }}/t7-0-run-info.txt
          if-no-files-found: error
