# SPDX-License-Identifier: GPL-3.0-only
name: OB-e2 #240 real palette smoke (SR8, devices off)

on:
  pull_request:
    paths:
      - 'native/tests2/ob_e2_240_smoke.cpp'
      - 'native/tests2/ob_e2_240_run.py'
      - '.github/workflows/ob-e2-240-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

# This dedicated evidence job is separate from Lab CI. The checkout is the
# SOURCE PR HEAD, not GitHub's synthetic merge commit. Nothing opens MIDI,
# PortAudio, OSC sockets/LAN or the Studio sidecar.
jobs:
  ob-e2-production-smoke:
    name: OB-e2 actual production Engine / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, runner: ubuntu-24.04}
          - {name: linux-arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm actual source checkout and test-local source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_reports/ob_e2_240
          git rev-parse HEAD | tee build_reports/ob_e2_240/checkout-sha.txt
          sha256sum native/tests2/ob_e2_240_smoke.cpp native/tests2/ob_e2_240_run.py \
            apps/studio/public/wirescape_modules.json facts/code/module_census.md \
            native/control/module_catalog.inc | tee build_reports/ob_e2_240/input-sha256.txt
          python3 -m py_compile native/tests2/ob_e2_240_run.py
      - name: Install pinned native CMake and Ninja
        run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Build actual Release production engine/catalogue (no devices)
        run: python tools/dev.py build --headless --config Release
      - name: Expose real original CPU probe compile command (build tree only)
        run: cmake -S native -B build/native -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: OB-e2 all 136 actual Engine cases (no XFAIL; preserves failures)
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tests2/ob_e2_240_run.py \
            --build build/native \
            --report build_reports/ob_e2_240/smoke.json \
            2>&1 | tee build_reports/ob_e2_240/runner.log
      - name: Upload exact-head per-ID and raw failure evidence on any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ob-e2-240-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build_reports/ob_e2_240/
          if-no-files-found: warn
          retention-days: 7
