# SPDX-License-Identifier: GPL-3.0-only
name: Device harness (devices off)
on:
  pull_request:
    paths:
      - "bench/device/**"
      - "bench/compare/**"
      - "facts/device/**"
      - "facts/compare/measured/**"
      - ".github/workflows/device-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-device-harness:
    name: Synthetic harness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline analysis dependencies
        run: python -m pip install -r bench/device/requirements.txt
      - name: Compile manual WASAPI helper (never execute)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -S bench/device -B build/device-capture
          cmake --build build/device-capture --config Release
      - name: Detector and authorization tests
        run: python -m unittest discover -s bench/device/tests
      - name: Pure synthetic dry-run
        run: python bench/device/run.py --dry-run --scenario all
      - name: Upload synthetic reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-simulated-${{ matrix.os }}
          path: |
            bench/device/results/**/report.md
            bench/device/results/**/analysis.json
            bench/device/results/**/manifest.json
          if-no-files-found: ignore

  real-null-engine:
    name: Real null-sink engine / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native and offline Python dependencies
        run: python -m pip install cmake==4.2.3 ninja==1.13.0 -r bench/device/requirements.txt -r bench/compare/requirements.txt
      - name: Fetch pinned PortAudio for Windows (build only, do not open audio)
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: PortAudio/portaudio
          ref: 147dd722548358763a8b649b3e4b41dfffbcfbb6
          path: .tools/portaudio-src
          persist-credentials: false
      - name: Build pinned PortAudio for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generator = python -c "import sys; sys.path.insert(0, 'tools'); from foundation.helpers import discover_toolchain; print(discover_toolchain()['generator'])"
          if ($LASTEXITCODE -or !$generator.StartsWith('Visual Studio')) { throw 'MSVC generator unavailable' }
          cmake -S .tools/portaudio-src -B .tools/portaudio-build -G "$generator" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DPA_BUILD_SHARED=ON -DPA_BUILD_STATIC=OFF -DPA_BUILD_TESTS=OFF -DPA_BUILD_EXAMPLES=OFF -DPA_USE_ASIO=OFF
          if ($LASTEXITCODE) { throw 'PortAudio configure failed' }
          cmake --build .tools/portaudio-build --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'PortAudio build failed' }
          $dll = Get-ChildItem .tools/portaudio-build -Recurse -Filter '*portaudio*.dll' | Select-Object -First 1
          if (!$dll) { throw 'PortAudio DLL unavailable' }
          "WIRESCAPE_PORTAUDIO=$($dll.FullName)" >> $env:GITHUB_ENV
      - name: Build actual headless Release engine and modules
        run: python tools/dev.py build --headless --config Release
      - name: Locate real executable
        run: |
          ENGINE="$(python -c "import sys; sys.path.insert(0,'tools'); from dev import _sidecar_executable; p=_sidecar_executable('Release'); print(p.as_posix()) if p else sys.exit(2)")"
          test -f "$ENGINE"
          echo "BENCH_ENGINE=$ENGINE" >> "$GITHUB_ENV"
      - name: Speaker check against actual null sink (no audio device)
        run: |
          python bench/device/run.py --dry-run --speaker-check --engine "$BENCH_ENGINE" --machine ci-speaker
          python -c "import json,glob; f=glob.glob('bench/device/results/ci-speaker/*/owner-observations.json'); assert len(f)==1; x=json.load(open(f[0])); assert x['completed'] and x['mode']=='null-audio' and x['heard']=='not-applicable-null-sink' and x['engine_mode']=='null-audio'"
      - name: Real null-sink all-scenarios dry-run
        run: python bench/device/run.py --dry-run --scenario all --engine "$BENCH_ENGINE" --machine ci-all
      - name: Real null-sink per-scenario reports
        run: |
          for scenario in basics chaos scene groove extreme endurance; do
            python bench/device/run.py --dry-run --scenario "$scenario" --engine "$BENCH_ENGINE" --machine "ci-$scenario"
          done
      - name: Real null-sink graph-limit refusal probe
        run: python bench/device/probe_limits.py --engine "$BENCH_ENGINE"
      - name: Comparison sampler against actual Wirescape null-sink process
        run: python bench/compare/measure.py --dry-run --tool wirescape --engine "$BENCH_ENGINE" --machine ci-null
      - name: Verify every real-engine report and expected refusal evidence
        run: python bench/device/check_ci_reports.py
      - name: Upload real null-sink evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-null-sink-${{ matrix.os }}
          path: |
            bench/device/results/ci-*/**/report.md
            bench/device/results/ci-*/**/analysis.json
            bench/device/results/ci-*/**/manifest.json
            bench/device/results/ci-*/**/events.ndjson
            bench/device/results/ci-speaker/**/owner-observations.json
            bench/device/results/ci-*/**/engine-stderr.log
            bench/device/results/limits/**/*
            bench/compare/results/ci-null/**/report.md
            bench/compare/results/ci-null/**/analysis.json
            bench/compare/results/ci-null/**/manifest.json
          if-no-files-found: error
