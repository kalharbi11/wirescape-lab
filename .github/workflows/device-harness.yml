# SPDX-License-Identifier: GPL-3.0-only
name: Device harness (devices off)
on:
  pull_request:
    paths:
      - "bench/device/**"
      - ".github/workflows/device-harness.yml"
  workflow_dispatch:

jobs:
  offline-device-harness:
    name: Offline harness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline analysis dependencies
        run: python -m pip install numpy scipy soundfile tzdata
      - name: Detector and authorization tests
        run: python -m unittest discover -s bench/device/tests
      - name: Pure offline dry-run
        run: python bench/device/run.py --dry-run --scenario all
      - name: Upload generated report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-harness-report-${{ matrix.os }}
          path: |
            bench/device/results/**/report.md
            bench/device/results/**/analysis.json
            bench/device/results/**/manifest.json
          if-no-files-found: ignore
