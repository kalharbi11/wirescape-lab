# SPDX-License-Identifier: GPL-3.0-only
name: OB-c A10 real native and Studio oracles (SR8, devices off)

on:
  pull_request:
    paths:
      - 'tests/native/abi2/ob_c_a10_*'
      - 'tests/native/abi2/ob_c_midi_to_cv_audio.cpp'
      - 'apps/studio/tests/ob-c-a10-knob-cadence.spec.ts'
      - 'apps/studio/tests/ob-c-asio-discovery.spec.cjs'
      - '.github/workflows/ob-c-a10.yml'
  workflow_dispatch:

permissions:
  contents: read

# One isolated SR8 job; does NOT edit shared native CMake/ci.yml/sidecar.
# Chromium is a synthetic Studio/browser client, while PCM runs through the
# actual device-off production sidecar and compiled production AppEngine.
jobs:
  a10-production-oracles:
    name: OB-c A10 actual null sink, frame oracles and Playwright replay / linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Record exact source SHA and unchanged oracle files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_reports/ob_c_a10
          git rev-parse HEAD | tee build_reports/ob_c_a10/source-head.txt
          sha256sum tests/native/abi2/ob_c_a10_* tests/native/abi2/ob_c_midi_to_cv_audio.cpp apps/studio/tests/ob-c-a10-knob-cadence.spec.ts \
            apps/studio/tests/ob-c-asio-discovery.spec.cjs \
            bench/offline/metrics.py apps/studio/src/panels/widgets/Knob.ts \
            | tee build_reports/ob_c_a10/source-shas.txt
          python -m py_compile tests/native/abi2/ob_c_a10_capture.py \
            tests/native/abi2/ob_c_a10_capture_tests.py tests/native/abi2/ob_c_a10_click_tests.py \
            tests/native/abi2/ob_c_a10_isolated.py
      - name: Install pinned CMake, Ninja, NumPy and SciPy
        run: python -m pip install cmake==4.2.3 ninja==1.13.0 numpy==2.1.3 scipy==1.14.1
      - name: Real Release native production sidecar and module build (devices off)
        run: python tools/dev.py build --headless --config Release
      - name: Export original native compile/link command database (build tree only)
        run: cmake -S native -B build/native -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build two isolated test-local programs with actual original production link flags
        shell: bash
        run: |
          set -euo pipefail
          python tests/native/abi2/ob_c_a10_isolated.py build \
            --build build/native --out build_reports/ob_c_a10 \
            2>&1 | tee build_reports/ob_c_a10/compile.log
      - name: Install real Studio Playwright and Chromium (fake device bridge only)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix apps/studio
          cd apps/studio
          npx playwright install --with-deps chromium
          node -e "const p=require('playwright');console.log(p.chromium.executablePath())"
      - name: Actual Playwright pointermove setParam trace and historical ASIO test
        shell: bash
        run: |
          set -euo pipefail
          export CI=1
          export WIRESCAPE_CHROMIUM="$(cd apps/studio && node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          test -x "$WIRESCAPE_CHROMIUM"
          cd apps/studio
          npx playwright test tests/ob-c-a10-knob-cadence.spec.ts \
            tests/ob-c-asio-discovery.spec.cjs --project=desktop --reporter=list \
            2>&1 | tee "$GITHUB_WORKSPACE/build_reports/ob_c_a10/playwright.log"
      - name: Extract and validate the exact actual Studio gesture timestamps
        shell: bash
        run: |
          set -euo pipefail
          python tests/native/abi2/ob_c_a10_isolated.py extract \
            --playwright-log build_reports/ob_c_a10/playwright.log \
            --out build_reports/ob_c_a10/studio-trace.json \
            2>&1 | tee build_reports/ob_c_a10/trace-validation.log
      - name: All production sidecar panic/buffer/basics, native click replay, Groove and historical MIDI
        shell: bash
        run: |
          set -euo pipefail
          python tests/native/abi2/ob_c_a10_isolated.py execute \
            --out build_reports/ob_c_a10 \
            2>&1 | tee build_reports/ob_c_a10/execution.log
      - name: Retain exact-head source, named failures, original PCM-oracle logs and actual Studio trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ob-c-a10-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build_reports/ob_c_a10/
            apps/studio/test-results/
          if-no-files-found: warn
          retention-days: 7
