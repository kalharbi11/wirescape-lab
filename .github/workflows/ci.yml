# SPDX-License-Identifier: GPL-3.0-only
name: Lab CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: changed-scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify PR paths (fail closed)
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/ci/changed_scope.py

  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Python foundation regression suite
        run: python -m unittest discover -s tools/foundation/tests -v -b

  native:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: native build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-latest }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: windows-x64, runner: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Record native runner core count
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cores="$NUMBER_OF_PROCESSORS"
          else
            cores="$(nproc)"
          fi
          if ! [[ "$cores" =~ ^[1-9][0-9]*$ ]]; then echo "Invalid runner core count" >&2; exit 1; fi
          echo "Runner cores: $cores"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
      - name: Fetch pinned PortAudio for Windows
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: PortAudio/portaudio
          ref: 147dd722548358763a8b649b3e4b41dfffbcfbb6
          path: .tools/portaudio-src
          persist-credentials: false
      - name: Build pinned PortAudio for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generator = python -c "import sys; sys.path.insert(0, 'tools'); from foundation.helpers import discover_toolchain; print(discover_toolchain()['generator'])"
          if ($LASTEXITCODE -or !$generator.StartsWith('Visual Studio')) { throw 'MSVC generator unavailable' }
          cmake -S .tools/portaudio-src -B .tools/portaudio-build -G "$generator" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DPA_BUILD_SHARED=ON -DPA_BUILD_STATIC=OFF -DPA_BUILD_TESTS=OFF -DPA_BUILD_EXAMPLES=OFF -DPA_USE_ASIO=OFF
          if ($LASTEXITCODE) { throw 'PortAudio configure failed' }
          cmake --build .tools/portaudio-build --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'PortAudio build failed' }
          $dll = Get-ChildItem .tools/portaudio-build -Recurse -Filter '*portaudio*.dll' | Select-Object -First 1
          if (!$dll) { throw 'PortAudio DLL unavailable' }
          "WIRESCAPE_PORTAUDIO=$($dll.FullName)" >> $env:GITHUB_ENV
      - name: Native headless build
        run: python tools/dev.py build --headless
      - name: Native tests (devices off)
        run: python tools/dev.py test
      - name: Native CTest inventory (K1)
        run: ctest --test-dir build/native -C Release -N
      - name: Upload native failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-logs
          path: |
            build_reports/**/*.log
            build/native/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # Required literal check names are backed by real native matrix jobs.
  # Notes-only PRs use the same successful-scope skip as native.
  linux-x64:
    name: linux-x64
    permissions:
      contents: read
      actions: read
    needs: [scope, native]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real native build linux-x64 in current run attempt
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          NATIVE_MATRIX_RESULT: ${{ needs.native.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
        run: python tools/ci/verify_native_required.py --platform linux-x64

  linux-arm64:
    name: linux-arm64
    permissions:
      contents: read
      actions: read
    needs: [scope, native]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real native build linux-arm64 in current run attempt
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          NATIVE_MATRIX_RESULT: ${{ needs.native.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
        run: python tools/ci/verify_native_required.py --platform linux-arm64

  windows-x64:
    name: windows-x64
    permissions:
      contents: read
      actions: read
    needs: [scope, native]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real native build windows-x64 in current run attempt
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          NATIVE_MATRIX_RESULT: ${{ needs.native.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
        run: python tools/ci/verify_native_required.py --platform windows-x64

  sanitizers:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Record sanitizer runner core count
        run: |
          cores="$(nproc)"
          if ! [[ "$cores" =~ ^[1-9][0-9]*$ ]]; then echo "Invalid runner core count" >&2; exit 1; fi
          echo "Runner cores: $cores"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
      - name: Install and cap sanitizer ccache at 500 MB
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          ccache --max-size=500M
      - name: Configure ASan and UBSan with ccache launchers
        run: |
          cmake -S native -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Fingerprint actual compiler text and sanitizer flags
        id: sanitizer_cache_key
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib
          import os
          import subprocess

          cache = Path('build/asan/CMakeCache.txt').read_text(encoding='utf-8')
          values = {}
          for line in cache.splitlines():
              if line and not line.startswith(('#', '//')) and ':' in line and '=' in line:
                  key, value = line.split('=', 1)
                  values[key.split(':', 1)[0]] = value
          parts = []
          for name in ('CMAKE_C_COMPILER', 'CMAKE_CXX_COMPILER'):
              executable = values.get(name)
              if not executable or not Path(executable).is_file():
                  raise SystemExit(f'actual CMake compiler path unavailable: {name}')
              result = subprocess.run([executable, '--version'], capture_output=True,
                                      text=True, check=True)
              version = result.stdout + result.stderr
              if not version.strip():
                  raise SystemExit(f'actual CMake compiler version text empty: {name}')
              parts.append(f'{name}={executable}\n{version.strip()}')
          for name in ('CMAKE_C_FLAGS', 'CMAKE_CXX_FLAGS',
                       'CMAKE_BUILD_TYPE', 'CMAKE_POSITION_INDEPENDENT_CODE'):
              value = values.get(name)
              if value is None:
                  raise SystemExit(f'CMake sanitizer key input unavailable: {name}')
              parts.append(f'{name}={value}')
          contents = '\n'.join(parts) + '\n'
          fingerprint = hashlib.sha256(contents.encode('utf-8')).hexdigest()
          print(contents, end='')
          print('Sanitizer cache toolchain/flags SHA256:', fingerprint)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('fingerprint=' + fingerprint + '\n')
          PYCODE
      - name: PR-only restore sanitizer compiler cache
        if: ${{ github.event_name == 'pull_request' }}
        id: sanitizer_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ci1-sanitizers-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sanitizer_cache_key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci1-sanitizers-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sanitizer_cache_key.outputs.fingerprint }}-
      - name: Record cache provenance and reset statistics
        env:
          MATCHED_SANITIZER_KEY: ${{ steps.sanitizer_cache_restore.outputs.cache-matched-key }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Main/manual: no restore; resetting compiler cache for cold build"
            ccache --clear
          elif [ -z "$MATCHED_SANITIZER_KEY" ]; then
            echo "PR: no matching cache; cold build (not warm evidence)"
            ccache --clear
          else
            echo "PR restored cache key: $MATCHED_SANITIZER_KEY"
          fi
          ccache --zero-stats
      - name: Compile with ASan and UBSan
        run: cmake --build build/asan --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Print sanitizer ccache statistics
        if: ${{ always() }}
        run: ccache -s
      - name: Run all ABI2 sanitizer tests
        run: ctest --test-dir build/asan -R abi2 --output-on-failure
      - name: Sanitizer ABI2 CTest inventory (K1)
        run: ctest --test-dir build/asan -N -R abi2
      - name: Save cold-built compiler cache on main/manual only
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ci1-sanitizers-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sanitizer_cache_key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: build/asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  studio_shards:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: studio shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install browser and Electron dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright install ffmpeg
          echo "WIRESCAPE_CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Typecheck Studio
        run: npm run typecheck
      - name: Studio test inventory (shard ${{ matrix.shard }}/3; K1)
        run: npx playwright test --list --shard=${{ matrix.shard }}/3
      - name: Studio Playwright (shard ${{ matrix.shard }}/3)
        run: npm test -- --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-failures-shard-${{ matrix.shard }}
          path: apps/studio/test-results/
          if-no-files-found: ignore

  # Preserve the required check name while retaining each real Playwright shard.
  # `needs.studio_shards.result` alone can miss an individual matrix-leg cancellation,
  # so also validate the three per-job conclusions from this public run.
  studio:
    name: studio
    permissions:
      contents: read
      actions: read
    needs: [scope, studio_shards]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every Studio shard passed
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          STUDIO_MATRIX_RESULT: ${{ needs.studio_shards.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
        run: python tools/ci/verify_native_required.py --studio
  desktop:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build prerequisites and Electron libraries
        run: |
          python -m pip install cmake==4.2.3 ninja==1.13.0
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Desktop Electron tests (null audio)
        run: xvfb-run -a npm test
        working-directory: apps/desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failures
          path: apps/desktop/test-results/
          if-no-files-found: ignore
