# SPDX-License-Identifier: GPL-3.0-only
name: Lab CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: changed-scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify PR paths (fail closed)
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/ci/changed_scope.py

  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Python foundation regression suite
        run: python -m unittest discover -s tools/foundation/tests -v -b

  native:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-latest }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: windows-x64, runner: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Record native runner core count
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cores="$NUMBER_OF_PROCESSORS"
          else
            cores="$(nproc)"
          fi
          if ! [[ "$cores" =~ ^[1-9][0-9]*$ ]]; then echo "Invalid runner core count" >&2; exit 1; fi
          echo "Runner cores: $cores"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
      - name: Fetch pinned PortAudio for Windows
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: PortAudio/portaudio
          ref: 147dd722548358763a8b649b3e4b41dfffbcfbb6
          path: .tools/portaudio-src
          persist-credentials: false
      - name: Build pinned PortAudio for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generator = python -c "import sys; sys.path.insert(0, 'tools'); from foundation.helpers import discover_toolchain; print(discover_toolchain()['generator'])"
          if ($LASTEXITCODE -or !$generator.StartsWith('Visual Studio')) { throw 'MSVC generator unavailable' }
          cmake -S .tools/portaudio-src -B .tools/portaudio-build -G "$generator" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DPA_BUILD_SHARED=ON -DPA_BUILD_STATIC=OFF -DPA_BUILD_TESTS=OFF -DPA_BUILD_EXAMPLES=OFF -DPA_USE_ASIO=OFF
          if ($LASTEXITCODE) { throw 'PortAudio configure failed' }
          cmake --build .tools/portaudio-build --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'PortAudio build failed' }
          $dll = Get-ChildItem .tools/portaudio-build -Recurse -Filter '*portaudio*.dll' | Select-Object -First 1
          if (!$dll) { throw 'PortAudio DLL unavailable' }
          "WIRESCAPE_PORTAUDIO=$($dll.FullName)" >> $env:GITHUB_ENV
      - name: Native headless build
        run: python tools/dev.py build --headless
      - name: Native tests (devices off)
        run: python tools/dev.py test
      - name: Native CTest inventory (K1)
        run: ctest --test-dir build/native -C Release -N
      - name: Upload native failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-logs
          path: |
            build_reports/**/*.log
            build/native/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizers:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Record sanitizer runner core count
        run: |
          cores="$(nproc)"
          if ! [[ "$cores" =~ ^[1-9][0-9]*$ ]]; then echo "Invalid runner core count" >&2; exit 1; fi
          echo "Runner cores: $cores"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
      - name: Compile with ASan and UBSan
        run: |
          cmake -S native -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build/asan --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Run all ABI2 sanitizer tests
        run: ctest --test-dir build/asan -R abi2 --output-on-failure
      - name: Sanitizer ABI2 CTest inventory (K1)
        run: ctest --test-dir build/asan -N -R abi2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: build/asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  studio:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: studio shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install browser and Electron dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright install ffmpeg
          echo "WIRESCAPE_CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Typecheck Studio
        run: npm run typecheck
      - name: Studio test inventory (shard ${{ matrix.shard }}/3; K1)
        run: npx playwright test --list --shard=${{ matrix.shard }}/3
      - name: Studio Playwright (shard ${{ matrix.shard }}/3)
        run: npm test -- --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-failures-shard-${{ matrix.shard }}
          path: apps/studio/test-results/
          if-no-files-found: ignore

  desktop:
    needs: scope
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build prerequisites and Electron libraries
        run: |
          python -m pip install cmake==4.2.3 ninja==1.13.0
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Desktop Electron tests (null audio)
        run: xvfb-run -a npm test
        working-directory: apps/desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failures
          path: apps/desktop/test-results/
          if-no-files-found: ignore
