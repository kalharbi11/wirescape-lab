# SPDX-License-Identifier: GPL-3.0-only
name: Rebuild comparison (advisory, devices off)
on:
  workflow_dispatch:
    inputs:
      before:
        description: "Full lab import SHA (previous engine)"
        required: true
        type: string
      after:
        description: "Full lab main SHA to measure"
        required: true
        type: string
permissions:
  contents: read
jobs:
  paired:
    name: Rebuild comparison / ${{ matrix.machine }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {machine: linux-x64, runner: ubuntu-24.04}
          - {machine: linux-arm64, runner: ubuntu-24.04-arm}
    env:
      BEFORE: ${{ inputs.before }}
      AFTER: ${{ inputs.after }}
      MACHINE: ${{ matrix.machine }}
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Validate subject pins
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$AFTER" =~ ^[0-9a-f]{40}$ && "$BEFORE" != "$AFTER" ]]
          test "$BEFORE" = 660556fbfb6ef30f828c68e9a05afa38ce0ee957
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.before }}
          path: before
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.after }}
          path: after
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install identical native and offline dependencies
        run: python -m pip install cmake==4.2.3 ninja==1.13.0 -r after/bench/offline/requirements.txt
      - name: Record exact subjects and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = "$BEFORE"
          test "$(git -C after rev-parse HEAD)" = "$AFTER"
          git -C after merge-base --is-ancestor "$AFTER" refs/remotes/origin/main
          mkdir -p evidence
          python - <<'PY'
          import datetime, json, os, platform, subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo
          def cmd(*args):
              return subprocess.check_output(args, text=True).strip()
          def cpu():
              return [line for line in Path("/proc/cpuinfo").read_text().splitlines()
                      if line.startswith(("model name", "CPU implementer", "CPU part"))]
          record = dict(before=os.environ["BEFORE"], after=os.environ["AFTER"],
                        before_upstream="44da1e4a235e606ebecd5bd6232f908d4df9b97f",
                        machine=os.environ["MACHINE"], architecture=platform.machine(),
                        workflow_sha=os.environ.get("GITHUB_WORKFLOW_SHA"),
                        cpu=sorted(set(cpu())), os=platform.platform(), compiler=cmd("c++", "--version").splitlines()[0],
                        cmake=cmd("cmake", "--version").splitlines()[0], python=platform.python_version(),
                        date_et=datetime.datetime.now(ZoneInfo("America/New_York")).isoformat(),
                        run_url=os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"])
          Path("evidence/provenance.json").write_text(json.dumps(record, indent=2)+"\n")
          PY
      - name: Build previous engine (stop if build fails)
        shell: bash
        run: |
          set -euo pipefail
          (cd before && python tools/dev.py build --headless --config Release) 2>&1 | tee evidence/before-build.log
      - name: Build rebuild
        shell: bash
        run: |
          set -euo pipefail
          (cd after && python tools/dev.py build --headless --config Release) 2>&1 | tee evidence/after-build.log
      - name: Collect paired native rows on one runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, math, os, re, subprocess
          from pathlib import Path

          evidence = Path("evidence").resolve()
          roots = {name: Path(name).resolve() for name in ("before", "after")}
          provenance = json.loads((evidence/"provenance.json").read_text())
          def write(name, value):
              (evidence/name).write_text(json.dumps(value, indent=2, allow_nan=False)+"\n")
          def call(args, root, timeout=180):
              try:
                  p = subprocess.run([str(x) for x in args], cwd=root, capture_output=True,
                                     text=True, stdin=subprocess.DEVNULL, timeout=timeout)
                  return dict(exit_code=p.returncode, stdout=p.stdout, stderr=p.stderr.replace(str(root), "<subject>"))
              except (OSError, subprocess.TimeoutExpired) as exc:
                  return dict(exit_code=None, stderr=str(exc).replace(str(root), "<subject>"))
          def parsed(result, prefix=""):
              if result["exit_code"] != 0:
                  return dict(status="unmeasured", **result)
              try:
                  raw = result["stdout"]
                  if prefix:
                      lines = [s[len(prefix):] for s in raw.splitlines() if s.startswith(prefix)]
                      if len(lines)!=1:
                          raise ValueError("expected one prefixed JSON row")
                      raw = lines[0]
                  return dict(status="measured", data=json.loads(raw))
              except (ValueError, KeyError) as exc:
                  return dict(status="unmeasured", reason=str(exc), **result)
          def checked_row(result, expected, metrics):
              if result["status"] != "measured":
                  return result
              try:
                  data = result["data"]
                  for key, value in expected.items():
                      if data[key] != value:
                          raise ValueError(f"{key}: expected {value!r}, observed {data[key]!r}")
                  if not isinstance(data["blocks"], int) or data["blocks"] <= 0:
                      raise ValueError("invalid block count")
                  for key in metrics:
                      value = data["render_ns"][key]
                      if not isinstance(value, (int,float)) or not math.isfinite(value) or value <= 0:
                          raise ValueError(f"invalid render_ns.{key}")
              except (KeyError, TypeError, ValueError) as exc:
                  return dict(status="unmeasured",reason=str(exc),data=result["data"])
              return result
          def binary(root, name):
              return root/"build/native"/name
          def manifest_ids(root, side):
              bases = ("native/modules2", "native/sdk/examples") if side=="before" else ("modules", "sdk/examples")
              paths = [p for base in bases for p in (root/base).glob("*/module.json")]
              ids = sorted(json.loads(p.read_text())["id"] for p in paths)
              catalog = root/("native/control/module_catalog.inc" if side=="before" else "engine/control/module_catalog.inc")
              expected = len(re.findall(r"(?m)^\s*WS_APP_MODULE\(", catalog.read_text()))
              if len(ids)!=expected or len(set(ids))!=expected:
                  raise RuntimeError("catalogue and manifest count mismatch")
              return ids
          ids = {side:manifest_ids(root, side) for side,root in roots.items()}
          common_ids = sorted(set(ids["before"]) & set(ids["after"]))
          write("inventory.json", dict(provenance=provenance, module_ids=ids, common_module_ids=common_ids))
          # The imported benchmark accepts exactly two positional arguments; 256 frames on both.
          for side,root in roots.items():
              target=evidence/(side+"-engine.json")
              result=call([binary(root,"abi2_benchmark"),root/"build/native",target],root)
              if result["exit_code"]==0 and target.is_file():
                  row=json.loads(target.read_text())
                  assert row["frames"]==256 and row["sample_rate"]==48000
                  assert len([x for x in row["rows"] if x["name"]=="abi2_poly8"])==1
              else:
                  write(side+"-engine-error.json",result)
          # Run both subjects consecutively per fixture; never compare different block sizes.
          module_rows=[]
          for ident in common_ids:
              for channels in (1,8):
                  row=dict(module=ident,channels=channels,instances=2,rate=48000,block=128,seconds=2)
                  for side,root in roots.items():
                      result=call([binary(root,"abi2_module_cpu_probe"),"--module",ident,"--rate",48000,
                                   "--block",128,"--channels",channels,"--instances",2,"--seconds",2],root,45)
                      row[side]=checked_row(parsed(result,"module_cpu_probe "),
                          dict(module=ident,instances=2,sample_rate=48000,block=128,channels=channels,seconds=2),
                          ("p99","max"))
                  module_rows.append(row)
          write("module-cpu.json",dict(provenance=provenance,rows=module_rows))
          # Same imported fixture bytes on both builds; report unaccepted fixtures explicitly.
          patches={side:{p.name:p for p in (root/"apps/studio/patches").glob("*.json")}
                   for side,root in roots.items()}
          common_patches=sorted(patches["before"].keys() & patches["after"].keys())
          soak_rows=[]
          for name in common_patches:
              fixture=patches["before"][name]
              row=dict(patch=name,fixture_sha256=hashlib.sha256(fixture.read_bytes()).hexdigest(),
                       fixture_subject=provenance["before"],input_mode="original; no scripted keyboard substitution",rate=48000,block=128,seconds=30)
              for side,root in roots.items():
                  result=call([binary(root,"wirescape_soak"),"--patch",fixture,"--rate",48000,
                               "--block",128,"--seconds",30],root,120)
                  row[side]=checked_row(parsed(result),
                      dict(graph="document",sample_rate=48000,block=128,seconds=30),
                      ("median","p99","max"))
              soak_rows.append(row)
          write("patch-cost.json",dict(provenance=provenance,rows=soak_rows,
                                      own_patch_names={k:sorted(v) for k,v in patches.items()}))
          # Current golden collector is read from the after pin and used unchanged for both.
          collector=roots["after"]/"bench/golden/render.py"
          spec=importlib.util.spec_from_file_location("golden",collector)
          golden=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(golden)
          for side,root in roots.items():
              rows=[]
              for name,fixture in sorted(patches[side].items()):
                  row=dict(patch=name,fixture_sha256=hashlib.sha256(fixture.read_bytes()).hexdigest())
                  try:
                      row.update(status="measured",data=golden.measure(binary(root,"wirescape_render"),fixture,"bundled",root))
                  except Exception as exc:
                      row.update(status="unmeasured",reason=str(exc).replace(str(root),"<subject>"))
                  rows.append(row)
              write(side+"-golden.json",dict(provenance=provenance,collector_subject=provenance["after"],rows=rows))
          # Static census of quoted catalogue IDs in explicit core path sets (not module definitions).
          all_ids=sorted(set(ids["before"])|set(ids["after"]))
          pattern=re.compile(r'"('+"|".join(re.escape(i) for i in all_ids)+r')"')
          for side,root in roots.items():
              bases=("native/engine2","native/control","native/document","native/sidecar","native/io") if side=="before" else ("engine","host")
              matches=[]
              for base in bases:
                  for path in sorted((root/base).rglob("*")):
                      if not path.is_file() or path.suffix not in (".h",".hpp",".cpp",".cc",".c") or "tests" in path.parts:
                          continue
                      for line_no,line in enumerate(path.read_text(errors="replace").splitlines(),1):
                          for ident in pattern.findall(line):
                              matches.append(dict(path=path.relative_to(root).as_posix(),line=line_no,id=ident))
              write(side+"-core-id-matches.json",dict(provenance=provenance,scope=bases,rows=matches))
              # Explicit names; engine artifact is sidecar executable, module libraries enumerated separately.
              files=[]
              for p in sorted((root/"build/native").glob("*")):
                  if p.is_file() and (p.name=="wirescape-engine" or
                     (p.name.startswith("libws2_") and p.suffix==".so" and
                      not p.name.startswith(("libws2_test_","libws2_guide_","libws2_sdk_")))):
                      sizes=call(["size","-A",p],root)
                      text=None
                      if sizes["exit_code"]==0:
                          text=sum(int(x.split()[1]) for x in sizes["stdout"].splitlines()
                                   if len(x.split())>=2 and (x.split()[0]==".text" or x.split()[0].startswith(".text.")))
                      files.append(dict(file=p.name,bytes=p.stat().st_size,text_bytes=text))
              write(side+"-binary-size.json",dict(provenance=provenance,rows=files))
          PY
      - name: Compare external SDK build in isolated directories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, subprocess, tempfile, shutil
          from pathlib import Path
          out=Path("evidence").resolve()
          meta=json.loads((out/"provenance.json").read_text())
          collector=Path("after/bench/sdk/out_of_tree_trial.py").resolve()
          spec=importlib.util.spec_from_file_location("sdk_trial",collector)
          trial=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(trial)
          rows={}
          for side,sdk in (("before","native/sdk"),("after","sdk")):
              source=(Path(side)/sdk).resolve()
              with tempfile.TemporaryDirectory(prefix="cmp-sdk-") as tmp:
                  root=Path(tmp)
                  try:
                      shutil.copytree(source,root/"sdk")
                      trial.prepare_template(root/"trial_gain",root/"sdk/template")
                      (root/"CMakeLists.txt").write_text("cmake_minimum_required(VERSION 3.20)\nproject(TrialGain LANGUAGES CXX)\nenable_testing()\nadd_subdirectory(trial_gain)\n")
                      stages=[]
                      for name,args in (("configure",["cmake","-S",str(root),"-B",str(root/"build"),"-DCMAKE_BUILD_TYPE=Release"]),
                                        ("build",["cmake","--build",str(root/"build"),"--config","Release"])):
                          run=subprocess.run(args,cwd=root,capture_output=True,text=True,timeout=180)
                          stages.append(dict(stage=name,exit_code=run.returncode,
                                             stdout=run.stdout.replace(tmp,"<trial>"),
                                             stderr=run.stderr.replace(tmp,"<trial>")))
                          if run.returncode: break
                      rows[side]=dict(status="pass" if len(stages)==2 and not stages[-1]["exit_code"] else "fail",stages=stages)
                  except (OSError, ValueError, subprocess.TimeoutExpired) as exc:
                      rows[side]=dict(status="unmeasured",reason=str(exc).replace(tmp,"<trial>"))
          (out/"external-sdk.json").write_text(json.dumps(dict(provenance=meta,collector_subject=meta["after"],rows=rows),indent=2)+"\n")
          PY
      - name: Record continuity source compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out=Path("evidence")
          meta=json.loads((out/"provenance.json").read_text())
          r=subprocess.run(["git","-C","before","grep","-n","-e","--capture-null-sink","--","native"],text=True,capture_output=True)
          if r.returncode not in (0,1): raise RuntimeError(r.stderr)
          reason="import does not contain --capture-null-sink; unchanged continuity harness cannot run" if r.returncode==1 else "unchanged harness compatibility requires verification"
          (out/"continuity-source.json").write_text(json.dumps(dict(provenance=meta,before=dict(status="unmeasured",reason=reason,matches=r.stdout.splitlines()),
              after=dict(status="separate historical source",facts_commit="ff206709b60cb26a34626c2ab38b1d864e59e4fb",source="facts/dsp/edit_continuity.md")),indent=2)+"\n")
          PY
      - name: Install the pinned Cortex-M7 compiler on x64
        if: matrix.machine == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arm-gnu-toolchain-14.2.rel1.tar.xz"
          url="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 "$url" -o "$archive"
          echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Compile module inventory with the same cross-toolchain
        if: matrix.machine == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess, tempfile
          from pathlib import Path
          out=Path("evidence").resolve()
          meta=json.loads((out/"provenance.json").read_text())
          results={}
          version=subprocess.check_output(["arm-none-eabi-g++","--version"],text=True).splitlines()[0]
          for side in ("before","after"):
              root=Path(side).resolve()
              module_dir,sdk,inc=("native/modules2","native/sdk","native/include") if side=="before" else ("modules","sdk","sdk/include")
              sources=sorted((root/module_dir).glob("*/module.cpp"))+sorted((root/sdk/"examples").glob("*/module.cpp"))
              sources.append(root/sdk/"template/module.cpp")
              catalog=root/("native/control/module_catalog.inc" if side=="before" else "engine/control/module_catalog.inc")
              count=len(re.findall(r"(?m)^\s*WS_APP_MODULE\(",catalog.read_text()))
              if len(sources)!=count+1: raise RuntimeError("catalogue inventory mismatch")
              rows=[]
              with tempfile.TemporaryDirectory(prefix="cmp-m7-") as temp:
                  for source in sources:
                      rel=source.relative_to(root)
                      for fpu in ("fpv5-d16","fpv5-sp-d16"):
                          row=dict(source=rel.as_posix(),fpu=fpu)
                          flags=["-std=c++17","-mcpu=cortex-m7","-mthumb","-mfpu="+fpu,
                                 "-mfloat-abi=hard","-fno-exceptions","-fno-rtti","-Os","-ffunction-sections",
                                 "-fdata-sections","-DWS_SIMD_SCALAR","-I",sdk,"-I",inc,"-I",sdk+"/examples"]
                          if source.parent.name=="macro_oscillator":
                              voices=[p for p in (root/"build/native").rglob("voice.h") if p.as_posix().endswith("/plaits/dsp/voice.h")]
                              stmlib=[p for p in (root/"build/native").rglob("stmlib.h") if p.parent.name=="stmlib"]
                              if len(voices)!=1 or len(stmlib)!=1:
                                  row.update(status="unmeasured",reason="pinned CMake macro source context not unique")
                                  rows.append(row); continue
                              flags+=["-I",str(voices[0].parents[2]),"-I",str(stmlib[0].parents[1]),
                                      "-DTEST","-include",str(source.parent/"rng_scope.hpp")]
                          p=subprocess.run(["arm-none-eabi-g++",*flags,"-c",str(rel),"-o",temp+"/module.o"],
                                           cwd=root,text=True,capture_output=True,timeout=180)
                          errors=[l.replace(str(root),"<subject>") for l in p.stderr.splitlines() if "error:" in l.lower()]
                          row.update(status="measured",compiles=p.returncode==0,exit_code=p.returncode,
                                     first_error=errors[0] if errors else None)
                          rows.append(row)
              results[side]=dict(catalogue_count=count,rows=rows)
          (out/"portability.json").write_text(json.dumps(dict(provenance=meta,compiler=version,
               archive_sha256="62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823",
               method="portability.yml compile flags, native CMake pinned macro sources, old/new include paths",results=results),indent=2)+"\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect UI frame p95 with unchanged current harness
        shell: bash
        run: |
          set -euo pipefail
          # A temporary copy of the current collector points at each subject's Studio.
          # Do not modify tracked source or make incompatible app hooks pass.
          python - <<'PY'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          out=Path("evidence").resolve()
          meta=json.loads((out/"provenance.json").read_text())
          collector=Path("after/bench/offline/ui_frames.cjs").resolve()
          results={}
          for side in ("before","after"):
              root=Path(side).resolve()
              app=root/"apps/studio"
              with tempfile.TemporaryDirectory(prefix="cmp-ui-") as temp:
                  overlay=Path(temp)
                  (overlay/"bench/offline").mkdir(parents=True)
                  (overlay/"apps").mkdir()
                  (overlay/"apps/studio").symlink_to(app,target_is_directory=True)
                  (overlay/".git").symlink_to(root/".git",target_is_directory=True)
                  target=overlay/"bench/offline/ui_frames.cjs"
                  shutil.copy2(collector,target)
                  def invoke(args,cwd=app,env=None,timeout=300):
                      return subprocess.run(args,cwd=cwd,env=env,text=True,capture_output=True,timeout=timeout)
                  try:
                      for args in (["npm","ci","--no-audit","--no-fund"],
                                   ["npx","playwright","install","--with-deps","chromium"],
                                   ["npm","run","build"]):
                          p=invoke(args)
                          if p.returncode: raise RuntimeError(" ".join(args)+": "+p.stderr[-1800:])
                      browser=invoke(["node","-e","console.log(require('playwright').chromium.executablePath())"])
                      if browser.returncode: raise RuntimeError(browser.stderr)
                      env=dict(os.environ,WIRESCAPE_CHROMIUM=browser.stdout.strip())
                      run=invoke(["node",str(target)],cwd=overlay,env=env,timeout=180)
                      report=overlay/"build_reports/l4/ui/summary.json"
                      if run.returncode or not report.is_file(): raise RuntimeError(run.stderr[-1800:] or "no frame report")
                      doc=json.loads(report.read_text())
                      if doc["commit"]!=meta[side]: raise RuntimeError("UI subject pin mismatch")
                      results[side]=dict(status="measured",data=doc)
                  except (OSError,ValueError,RuntimeError,subprocess.TimeoutExpired) as exc:
                      results[side]=dict(status="unmeasured",reason=str(exc).replace(temp,"<collector>").replace(str(root),"<subject>"))
          (out/"ui-frames.json").write_text(json.dumps(dict(provenance=meta,collector_subject=meta["after"],results=results),indent=2)+"\n")
          PY
      - name: Derive paired timing rows without changing raw evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path("evidence")
          def read(name):
              return json.loads((root/name).read_text())
          meta=read("provenance.json")
          def compare(before, after):
              valid=lambda v: isinstance(v,(int,float)) and not isinstance(v,bool) and math.isfinite(v) and v>0
              if not valid(before) or not valid(after):
                  return dict(status="unmeasured",before=before,after=after,reason="positive finite paired measurements required")
              return dict(status="measured",before=before,after=after,delta=after-before,ratio=after/before)
          assert compare(10,15)==dict(status="measured",before=10,after=15,delta=5,ratio=1.5)
          assert compare(None,15)["status"]=="unmeasured"
          assert compare(0,15)["status"]=="unmeasured"
          def timing(row, field, scale=1):
              def value(side):
                  record=row[side]
                  if record["status"]!="measured":
                      return None
                  return record["data"]["render_ns"][field]*scale
              result=compare(value("before"),value("after"))
              if result["status"]!="measured":
                  result["subject_status"]={side:row[side]["status"] for side in ("before","after")}
              return result
          def engine(side, field):
              path=root/(side+"-engine.json")
              if not path.is_file():
                  return None
              d=read(path.name)
              return next(row[field] for row in d["rows"] if row["name"]=="abi2_poly8")
          engine_rows={key:compare(engine("before",key),engine("after",key))
                       for key in ("mean_ns","p99_ns")}
          modules=[]
          for row in read("module-cpu.json")["rows"]:
              modules.append(dict(module=row["module"],channels=row["channels"],instances=2,
                                  block=128,rate=48000,unit="ns/block",
                                  p99=timing(row,"p99"),worst=timing(row,"max")))
          patch_source=read("patch-cost.json")
          patches=[]
          for row in patch_source["rows"]:
              p=dict(patch=row["patch"],fixture_sha256=row["fixture_sha256"],input_mode=row["input_mode"],
                     rate=48000,block=128,seconds=30)
              for key in ("median","p99","max"):
                  p[key+"_ns"]=timing(row,key)
                  p[key+"_percent_period"]=timing(row,key,100/(1e9*128/48000))
              patches.append(p)
          ranks={}
          for side in ("before","after"):
              observed=[r for r in patches if r["p99_ns"][side] is not None]
              expected=patch_source["own_patch_names"][side]
              complete=len(observed)==len(expected) and {r["patch"] for r in observed}==set(expected)
              ranks[side]=dict(coverage="complete" if complete else "partial",
                  measured=len(observed),expected=len(expected),
                  maximum_p99_among_measured=max(observed,key=lambda r:r["p99_ns"][side])["patch"] if observed else None)
          (root/"paired-timing-summary.json").write_text(json.dumps(dict(provenance=meta,
              engine=dict(rate=48000,block=256,unit="ns/block",metrics=engine_rows),
              modules=modules,patches=patches,patch_ranks=ranks,
              ratio_definition="after/before; timing is hosted-runner diagnostic"),indent=2,allow_nan=False)+"\n")
          PY
      - name: Upload raw paired evidence, even on build or collection failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-comparison-${{ matrix.machine }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
