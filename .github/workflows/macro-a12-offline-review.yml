# SPDX-License-Identifier: GPL-3.0-only
name: Macro A12 archived pitch analysis (SR8, advisory, NO RECAPTURE)

on:
  pull_request:
    paths:
      - 'bench/evidence/macro_non48/a12_analyze.py'
      - 'bench/evidence/macro_non48/test_a12_analyze.py'
      - 'bench/evidence/macro_non48/A12_*'
      - 'bench/evidence/macro_non48/README_A12.md'
      - '.github/workflows/macro-a12-offline-review.yml'
  workflow_dispatch:

permissions:
  contents: read

# Separate PR branched directly from main. The original PR230 capture
# workflow and every one of its steps are entirely untouched. This workflow
# has no CMake/native build, valgrind, ffmpeg, renderer, audio download or
# source-capture job. Original collector tests use a pinned source snapshot.
jobs:
  a12-read-only:
    name: A12 synthetic + original collector unit tests / ${{ matrix.machine }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {machine: linux-x64, runner: ubuntu-24.04}
          - {machine: linux-arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original offline Python requirements (no native execution)
        run: python -m pip install -r bench/offline/requirements.txt
      - name: A12 syntax and 11 strict positive/negative applicability tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_reports/macro-a12
          python -m py_compile bench/evidence/macro_non48/a12_analyze.py bench/evidence/macro_non48/test_a12_analyze.py
          python -m unittest discover -s bench/evidence/macro_non48 -p 'test_a12_analyze.py' -v \
            2>&1 | tee build_reports/macro-a12/a12-tests.log
      - name: Validate original PR230 collector 8 unit tests from fixed review SHA
        shell: bash
        env:
          COLLECTOR_PR230_SHA: 53317f0e5df33024bf1f6650915d71568a104c28
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/pull/230/head
          test "$(git rev-parse FETCH_HEAD)" = "$COLLECTOR_PR230_SHA" || {
            echo "PR230 source changed; refusing ambiguous unit-test source" >&2
            exit 2
          }
          mkdir -p "$RUNNER_TEMP/pr230-collector"
          git archive FETCH_HEAD \
            bench/evidence/macro_non48/collect.py \
            bench/evidence/macro_non48/test_collect.py \
            | tar -x -C "$RUNNER_TEMP/pr230-collector"
          python -m py_compile "$RUNNER_TEMP/pr230-collector/bench/evidence/macro_non48/collect.py" \
            "$RUNNER_TEMP/pr230-collector/bench/evidence/macro_non48/test_collect.py"
          python -m unittest discover \
            -s "$RUNNER_TEMP/pr230-collector/bench/evidence/macro_non48" \
            -p 'test_collect.py' -v 2>&1 | tee build_reports/macro-a12/original-collector-tests.log
      - name: Verify published immutable A12 tables and original source/raw hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee build_reports/macro-a12/published-table-check.log
          import hashlib, json, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, "bench/evidence/macro_non48")
          import a12_analyze as a
          root=Path("bench/evidence/macro_non48")
          expected={
              "linux-x64": ("0156d905f9b72663964acdf2bc8691bd661873573f2fec2c3772a3be5e02c041",14396920224),
              "linux-arm64": ("0a60d49e2e5fddef57790d2b8fbfd2989f680316669b63364eaf736757751411",14394124427),
          }
          for arch,(expected_sha,artifact_id) in expected.items():
              path=root/("A12_"+arch+"_rows.json")
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected_sha, (arch,"saved SHA")
              doc=json.loads(path.read_text(encoding="utf-8"))
              assert doc["artifact_id"]==artifact_id and doc["source_run"]==44229365015
              assert doc["sources"]=={"before":a.BASE_SHA,"head":a.HEAD_SHA}
              assert doc["original_estimator_sha256"]==a.METRICS_HASH
              refs=doc["classifications_48k"]
              rows=doc["rows"]
              assert len(refs)==120 and len(rows)==240
              refmap={(r["model"],r["target_hz"]):r for r in refs}
              assert set(refmap)=={(m,hz) for m in range(24) for hz in a.HZS}
              assert sum(bool(r["pitch_defined"]) for r in refs)==86
              for r in refs:
                  margins=(r["dominance_margin_vs_1dB"],r["level_margin_vs_minus40dB"])
                  assert r["pitch_defined"]==all(x is not None and x>=-1e-12 for x in margins)
                  assert len(r["sha256_original_pcm"])==64
              keys=set()
              for r in rows:
                  key=(r["model"],r["target_hz"],r["rate_hz"])
                  assert key not in keys
                  keys.add(key)
                  assert r["rate_hz"] in a.OFF
                  assert r["model_name"]==a.MODEL_NAMES[r["model"]]
                  assert len(r["sha256_48k_original_pcm"])==64
                  assert len(r["sha256_off_original_pcm"])==64
                  ref=refmap[r["model"],r["target_hz"]]
                  assert r["sha256_48k_original_pcm"]==ref["sha256_original_pcm"]
                  assert r["status"]==a.pitch_decision(ref,r["original_estimator_delta_cents"])
              assert keys=={(m,hz,rate) for m in range(24) for hz in a.HZS for rate in a.OFF}
              counts=Counter(r["status"] for r in rows)
              assert counts=={"pass":172,"pitch_not_defined":68},(arch,counts)
              print(arch, "verified pinned table", counts)
          model=root/"A12_model_summary.json"
          assert hashlib.sha256(model.read_bytes()).hexdigest()=="2da9031a388d27bd31d219e060c7be149308271bf5ef9d1a6084df8cf45e15d6"
          summary=json.loads(model.read_text(encoding="utf-8"))
          assert summary["counts_total"]=={"pass":344,"pitch_not_defined":136}
          assert not summary["any_failed_defined_pitch"]
          assert len(summary["per_model"])==24
          assert summary["no_defined_pitch_models"]==[
              "03 Six-op FM B","07 Chiptune","12 Additive","14 Chords","18 Particle"]
          print("A12 full immutable table checks passed. No render/capture or metric substitution.")
          PY
          git rev-parse HEAD | tee build_reports/macro-a12/checkout-sha.txt
          sha256sum bench/evidence/macro_non48/a12_analyze.py \
            bench/evidence/macro_non48/test_a12_analyze.py \
            bench/evidence/macro_non48/A12_*.json \
            bench/evidence/macro_non48/A12_*.md \
            | tee build_reports/macro-a12/source-table-shas.txt
      - name: Upload source/test verification logs ONLY, never audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-a12-unit-${{ matrix.machine }}-${{ github.run_id }}
          path: build_reports/macro-a12/
          if-no-files-found: warn
          retention-days: 7
