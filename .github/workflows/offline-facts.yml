# SPDX-License-Identifier: GPL-3.0-only
name: Offline facts (non-required)
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'bench/offline/**'
      - '.github/workflows/offline-facts.yml'
      - 'native/**'
      - 'engine/**'
      - 'host/**'
      - 'modules/**'
      - 'sdk/**'
      - 'targets/**'
      - 'tests/native/**'
      - 'tools/dev.py'
      - 'tools/foundation/tests/test_build_failure_diagnostics.py'
      - 'tools/render/**'
      - 'tools/capture/**'
      - 'apps/studio/patches/**'

jobs:
  offline-facts:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Offline facts / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install -r bench/offline/requirements.txt
      - name: Pure DSP metric tests
        run: python -m unittest discover -s bench/offline -p 'test_*.py' -v
      # VS 2026's default MSVC 14.52 rejects libremidi/system_error2.hpp.
      # Use the installed VS 2022 v143 toolset, as in the passing native Lab build.
      - name: Select compatible Windows MSVC toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_GENERATOR_TOOLSET=v143" >> $env:GITHUB_ENV
      - name: Release headless build
        run: python tools/dev.py build --headless --config Release
      - name: Record Windows compiler and toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Select-String -Path build/native/CMakeCache.txt -Pattern '^CMAKE_GENERATOR(:|_TOOLSET:)'
          Get-ChildItem -Path build/native/CMakeFiles -Recurse -Filter CMakeCXXCompiler.cmake -File |
            Select-String -Pattern '^set\(CMAKE_CXX_COMPILER(_VERSION)? '
      - name: Print full failed Windows build log
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Get-ChildItem -Path build_reports/foundation -Filter 'build-*.log' -File | ForEach-Object {
            Write-Host "Build log: $($_.Name)"
            Get-Content -LiteralPath $_.FullName
          }
      - name: Offline fact pack
        run: python bench/offline/run_all.py --quick --out-dir '${{ runner.temp }}/wirescape-offline-facts'
      - name: Validate mandatory fact evidence
        run: python bench/offline/verify_artifacts.py --out-dir '${{ runner.temp }}/wirescape-offline-facts'
      - name: Upload numeric measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-facts-${{ matrix.runner }}
          path: ${{ runner.temp }}/wirescape-offline-facts
          if-no-files-found: warn
