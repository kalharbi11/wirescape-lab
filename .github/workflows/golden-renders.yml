# SPDX-License-Identifier: GPL-3.0-only
name: Golden patch renders (advisory)

on:
  pull_request:
    paths:
      - "native/**"
      - "bench/golden/**"
      - "bench/patches/owner/**"
      - "facts/dsp/**"
      - ".github/workflows/golden-renders.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - "bench/golden/**"
      - "bench/patches/owner/**"
      - "facts/dsp/**"
      - ".github/workflows/golden-renders.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: Golden render / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-latest }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: windows-x64, runner: windows-latest }
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout lab only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing pinned build tools and offline requirements
        run: python -m pip install cmake==4.2.3 ninja==1.13.0 -r bench/offline/requirements.txt
      - name: Fetch pinned PortAudio for Windows (build only)
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: PortAudio/portaudio
          ref: 147dd722548358763a8b649b3e4b41dfffbcfbb6
          path: .tools/portaudio-src
          persist-credentials: false
      - name: Build pinned PortAudio for Windows without opening a device
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generator = python -c "import sys; sys.path.insert(0, 'tools'); from foundation.helpers import discover_toolchain; print(discover_toolchain()['generator'])"
          if ($LASTEXITCODE -or !$generator.StartsWith('Visual Studio')) { throw 'MSVC generator unavailable' }
          cmake -S .tools/portaudio-src -B .tools/portaudio-build -G "$generator" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DPA_BUILD_SHARED=ON -DPA_BUILD_STATIC=OFF -DPA_BUILD_TESTS=OFF -DPA_BUILD_EXAMPLES=OFF -DPA_USE_ASIO=OFF
          if ($LASTEXITCODE) { throw 'PortAudio configure failed' }
          cmake --build .tools/portaudio-build --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'PortAudio build failed' }
          $dll = Get-ChildItem .tools/portaudio-build -Recurse -Filter '*portaudio*.dll' | Select-Object -First 1
          if (!$dll) { throw 'PortAudio DLL unavailable' }
          "WIRESCAPE_PORTAUDIO=$($dll.FullName)" >> $env:GITHUB_ENV
      - name: Build native headless Release renderer
        run: python tools/dev.py build --headless --config Release
      - name: Altered-render comparator unit tests (no devices)
        run: python -m unittest discover -s bench/golden/tests -v
      - name: Render all bundled and owner patches twice without devices
        run: python bench/golden/render.py --machine ${{ matrix.name }} --out build_reports/golden/${{ matrix.name }}/golden.json
      - name: Emit compact numeric baseline chunks for traceable fact staging
        run: |
          python -c 'import json,sys,pathlib; p=pathlib.Path("build_reports/golden")/sys.argv[1]/"golden.json"; compact=json.dumps(json.loads(p.read_text()),separators=(",",":"),allow_nan=False); [print("GOLDEN_CHUNK %d %s"%(i//1400,compact[i:i+1400])) for i in range(0,len(compact),1400)]' ${{ matrix.name }}
      - name: Compare architecture-matched committed golden (when available)
        run: |
          reference="facts/dsp/${{ matrix.name }}/golden.json"
          measured="build_reports/golden/${{ matrix.name }}/golden.json"
          if test -f "$reference"; then
            python bench/golden/compare.py "$reference" "$measured"
          else
            echo "BASELINE_PENDING: no committed $reference yet; measured candidate emitted"
          fi
      - name: Upload per-architecture JSON and diagnostics (no audio files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.name }}
          path: build_reports/golden/${{ matrix.name }}/golden.json
          if-no-files-found: warn
